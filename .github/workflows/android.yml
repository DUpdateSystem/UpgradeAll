name: Android CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'source/**'
      - '**.md'
      - 'fastlane/**'
  pull_request:
    paths-ignore:
      - 'source/**'
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:
    inputs:
      official_release:
        description: Build a release APK with the exact Gradle version name
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Setup Repo
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Cargo with aarch64-linux-android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add Rust target architectures
        run: rustup target add i686-linux-android x86_64-linux-android armv7-linux-androideabi

      - name: Retrieve version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Split due https://github.com/mozilla/rust-android-gradle/issues/38
      - name: Build with Gradle (debug) and run unit tests
        run: ./gradlew "-PappVerName=$VERSION" :app:assembleDebug testDebugUnitTest

      - name: Build with Gradle (release)
        if: ${{ !github.event.pull_request }}
        env:
          OFFICIAL_RELEASE: ${{ inputs.official_release }}
        run: |
          if [[ "$OFFICIAL_RELEASE" == true ]]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew "-PappVerName=$VERSION" :app:assembleRelease
          fi

      - name: Sign Android release
        if: ${{ !github.event.pull_request }}
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apks=(app/build/outputs/apk/release/*.apk)
          [[ ${#apks[@]} -eq 1 && -f "${apks[0]}" ]]
          keystore=$(mktemp "$RUNNER_TEMP/upgradeall-keystore.XXXXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          signed="app/build/outputs/apk/release-signed/$(basename "${apks[0]}")"
          mkdir -p "$(dirname "$signed")"
          "$tools/zipalign" -c -P 16 4 "${apks[0]}"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false --out "$signed" "${apks[0]}"
          "$tools/apksigner" verify "$signed"
          echo "signedReleaseFile=$signed" >> "$GITHUB_OUTPUT"

      - name: Upload debug apk
        uses: actions/upload-artifact@v6
        if: ${{ !github.event.pull_request }}
        with:
          path: './app/build/outputs/apk/debug/*.apk'
          name: build_debug_${{ env.VERSION }}

      - name: Upload release apk
        uses: actions/upload-artifact@v6
        if: ${{ !github.event.pull_request }}
        with:
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          name: build_release_${{ env.VERSION }}
          if-no-files-found: error

      - name: Find debug APK
        if: ${{ !github.event.pull_request && !inputs.official_release }}
        run: |
          apks=(app/build/outputs/apk/debug/*.apk)
          [[ ${#apks[@]} -eq 1 && -f "${apks[0]}" ]]
          echo "DEBUG_APK=${apks[0]}" >> "$GITHUB_ENV"

      - name: Generate Commit Message
        if: ${{ !github.event.pull_request && !inputs.official_release }}
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=format:%s)
          AUTHOR_NAME=$(git log -1 --pretty=format:%an)
          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$VERSION"

          TELEGRAM_MESSAGE="New push to Github!
          \`\`\`$COMMIT_MESSAGE\`\`\`
          by \`$AUTHOR_NAME\`
          See commit detail [Here]($COMMIT_URL)
          Snapshot apk is attached"

          {
            echo 'TELEGRAM_MESSAGE<<EOF'
            echo "$TELEGRAM_MESSAGE"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Send commit to Telegram
        if: ${{ !github.event.pull_request && !inputs.official_release }}
        continue-on-error: true
        uses: xz-dev/TelegramFileUploader@v1
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        with:
          to-who: ${{ secrets.TELEGRAM_TO }}
          message: ${{ env.TELEGRAM_MESSAGE }}
          files: |
            /github/workspace/${{ steps.sign.outputs.signedReleaseFile }}
            /github/workspace/${{ env.DEBUG_APK }}
