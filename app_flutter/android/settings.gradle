pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    def ensureCargoBinPath = {
        def localPropertiesFile = file("local.properties")
        def properties = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def configuredCargoBin = properties.getProperty("cargo.bin")
        if (configuredCargoBin != null && !configuredCargoBin.isBlank()) {
            return
        }
        def pathEntries = (System.getenv("PATH") ?: "").split(File.pathSeparator)
        def cargoFile = pathEntries.collect { new File(it, "cargo") }.find { it.isFile() && it.canExecute() }
        if (cargoFile == null) {
            return
        }
        properties.setProperty("cargo.bin", cargoFile.parentFile.absolutePath)
        localPropertiesFile.withOutputStream { properties.store(it, "Generated by Gradle so android-rust can find Cargo binaries") }
    }
    ensureCargoBinPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
        id "com.android.library" version "9.0.1" apply false
        id "org.jetbrains.kotlin.android" version "2.3.20" apply false
        id "io.github.MatrixDev.android-rust" version "0.6.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
}

include ":app"
include ":getter_bridge"
project(":getter_bridge").projectDir = file("getter_bridge")
